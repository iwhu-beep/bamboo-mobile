name: Build iOS IPA

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Select Xcode
        run: |
          # Show available Xcode versions
          ls /Applications/Xcode*.app 2>/dev/null || true
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version
          xcodebuild -showsdks 2>/dev/null | head -20 || true

      - name: Download iOS Platform
        run: |
          # Download the iOS platform for the selected Xcode
          xcodebuild -downloadPlatform iOS || true
          # Show installed platforms
          xcodebuild -showPlatforms 2>/dev/null || true

      - name: Build
        run: |
          cd ios
          xcodebuild clean archive \
            -workspace BambooMobile.xcworkspace \
            -scheme BambooMobile \
            -configuration Release \
            -archivePath ../build/BambooMobile.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          cd ..

      - name: Create ExportOptions
        run: |
          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          cd ios
          xcodebuild -exportArchive \
            -archivePath ../build/BambooMobile.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath ../build/output
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BambooMobile-${{ github.sha }}
          path: build/output/*.ipa
          retention-days: 30
